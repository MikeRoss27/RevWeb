# cargo-deny policy: advisories, licenses, duplicate/banned crates and sources.
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Vulnerabilities and unmaintained/unsound crates fail the check. Ignore an
# advisory only with a dated reason and a link, and remove it once fixed.
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
# Workspace crates are path dependencies without a version, which cargo-deny
# reports as wildcards because the crates are not marked `publish = false`.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
