<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose your preferred language</title>
</head>

<body>
Select your language:

<select><script>

var s = location.href.substring(document.location.href.indexOf("default=")+8);

if (s.charAt(3) == "S") {
    document.write("<OPTION value=1>"+s+"</OPTION>");
    document.write("<OPTION value=2>English</OPTION>");
    document.write("<OPTION value=3>French</OPTION>");
}
else if (s.charAt(3) == "C") {
    document.write("<OPTION value=1>Korean</OPTION>");
    document.write("<OPTION value=2>Japanese</OPTION>");
    document.write("<OPTION value=3>"+s+"</OPTION>");
}
else {
    document.write("<OPTION value=1>Urdu</OPTION>");
    document.write("<OPTION value=2>Khmer</OPTION>");
}

</script></select>
</body>


</html>
