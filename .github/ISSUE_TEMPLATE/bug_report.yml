name: Bug report
description: Something in Webrev behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real credentials, tokens or customer data. For a security
        vulnerability in Webrev itself, use a private security advisory instead
        (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Command line, flags, and a local fixture if possible. Only targets you are authorised to test.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [static extraction, active checks, browser, scope or safety, reports, TUI, CI or release, other]
