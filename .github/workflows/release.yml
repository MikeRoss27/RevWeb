name: Release

# Tag vX.Y.Z (matching Cargo.toml) -> CI -> portable bundles -> draft release.
# The release stays a draft so a human reviews notes and assets before publishing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: tag matches workspace version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare tag with Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match workspace version v$version" >&2
            exit 1
          fi

  ci:
    name: ci
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  bundles:
    name: bundles
    needs: ci
    uses: ./.github/workflows/bundles.yml

  publish:
    name: draft release
    needs: bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: webrev-*
          merge-multiple: true
          path: dist
      - name: Aggregate checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum -- * | grep -v 'SHA256SUMS$' > SHA256SUMS.all
          mv SHA256SUMS.all SHA256SUMS
          cat SHA256SUMS
      # Build provenance attestations are not available for private repositories
      # on this plan; they switch on if the repository becomes public.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$REPO" --draft --verify-tag --generate-notes --title "$TAG"
