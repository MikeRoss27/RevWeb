# Cargo.toml
[workspace]
resolver = "2"
members = [
    "crates/webrev-core",
    "crates/webrev-extract",
    "crates/webrev-storage",
    "crates/webrev-pipeline",
    "crates/webrev-browser",
    "crates/webrev-report",
    "crates/webrev-tui",
    "crates/webrev-cli",
]
# cargo-fuzz targets are nightly-only and live in their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["webrev contributors"]

[workspace.dependencies]
# --- internal crates ---
webrev-core = { path = "crates/webrev-core" }
webrev-extract = { path = "crates/webrev-extract" }
webrev-storage = { path = "crates/webrev-storage" }
webrev-pipeline = { path = "crates/webrev-pipeline" }
webrev-browser = { path = "crates/webrev-browser" }
webrev-report = { path = "crates/webrev-report" }
webrev-tui = { path = "crates/webrev-tui" }

# --- error handling ---
thiserror = "2.0.21"
anyhow = "1.0.104"

# --- serde / data ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
hex = "0.4.3"
ipnet = "2.12.2"
base64 = "0.23.1"

# --- async runtime ---
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
async-trait = "0.1.92"
futures = "0.3.34"

# --- extraction ---
regex = "1.13.1"
lol_html = "3.0.1"
# swc_core bundles swc_common / ecma_ast / ecma_parser / ecma_visit at
# internally-aligned versions behind feature flags, which sidesteps the
# notoriously fragile cross-crate version matching of the standalone swc crates.
swc_core = { version = "82.0.1", features = ["ecma_parser", "ecma_ast", "ecma_visit", "common"] }

# --- network ---
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "json"] }

# --- browser ---
# 0.9 runs on tokio by default (the old async-std/tokio runtime feature flags
# were removed). `bytes` is its default feature.
chromiumoxide = "0.9.1"

# --- crypto (secret fingerprints) ---
hmac = "0.13.0"
sha2 = "0.11.0"

# --- randomness (jitter / fingerprint seeds) ---
rand = "0.10.3"
rand_distr = "0.6.0"

# --- cli / tui ---
clap = { version = "4.6.7", features = ["derive", "env"] }
ratatui = "0.30.2"
crossterm = "0.29.0"

# --- observability ---
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# --- test support ---
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
